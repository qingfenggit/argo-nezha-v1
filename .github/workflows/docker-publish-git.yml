name: docker-publish-git

on:
  workflow_dispatch:  # 手动触发，方便调试
  schedule:
    - cron: '0 19 * * 2,6'  # 对应北京时间每周三、周日凌晨 3:00

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_IMAGE_NAME: "argo-nezha-v1"
  GITHUB_REPO: "nezhahq/nezha"   # 统一使用官方新组织名
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 使用 jq 安全地获取上游最新的 Release Tag
      - name: Get latest release tag
        id: get_latest_tag
        run: |
          LATEST_TAG=$(curl -s "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest" | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "获取上游版本失败！" && exit 1
          fi
          echo "Upstream latest tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # 2. 从你的 Docker Hub 仓库获取除了 latest 以外最新的 tag
      - name: Get current Docker image version
        id: get_current_version
        run: |
          CURRENT_TAG=$(curl -s "https://hub.docker.com/v2/repositories/${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}/tags/?page_size=100" | \
                        jq -r '.results[] | select(.name != "latest") | .name' | sort -V | tail -n 1)
          if [ -z "$CURRENT_TAG" ] || [ "$CURRENT_TAG" = "null" ]; then
            CURRENT_TAG="v0.0.0" # 如果 Docker Hub 是空的，给个初始版本号
          fi
          echo "Current Docker Hub tag: $CURRENT_TAG"
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      # 3. 核心版本对比
      - name: Compare versions
        id: compare_versions
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          CURRENT_TAG="${{ steps.get_current_version.outputs.current_tag }}"

          # 统一去掉开头的 'v' 进行纯数字版本号对比
          LATEST_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
          CURRENT_VERSION=$(echo "$CURRENT_TAG" | sed 's/^v//')

          echo "Comparing Upstream ($LATEST_VERSION) with Docker Hub ($CURRENT_VERSION)..."

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            # 确保上游版本确实比本地更新（利用 sort -V 排序）
            HIGHER_VERSION=$(echo -e "$LATEST_VERSION\n$CURRENT_VERSION" | sort -V | tail -n 1)
            if [ "$HIGHER_VERSION" == "$LATEST_VERSION" ]; then
              echo "发现新版本，允许构建！"
              echo "should_build=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "暂无新版本或上游版本更旧，跳过构建。"
          echo "should_build=false" >> $GITHUB_OUTPUT

      # 4. 环境准备 (只有当 should_build 为 true 时才执行)
      - name: Set up QEMU
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # 5. 构建并推送镜像 (使用最新的 actions 版本)
      - name: Build and push Docker image
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get_latest_tag.outputs.latest_tag }}

      # 6. 修复后的 Telegram 通知步骤
      - name: Send Telegram notification
        if: steps.compare_versions.outputs.should_build == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          DOCKER_IMAGE_URL="https://hub.docker.com/r/${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}/tags"
          MESSAGE="<b>新镜像构建成功 🚀</b>%0A%0A<b>项目:</b> ${{ env.DOCKER_IMAGE_NAME }}%0A<b>新版本:</b> ${{ steps.get_latest_tag.outputs.latest_tag }}%0A<b>Docker Hub:</b> $DOCKER_IMAGE_URL"
          
          # 正确发起 API 请求发送通知
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"

  # 清理历史运行记录的独立 Job
  cleanup-runs:
    runs-on: ubuntu-latest
    needs: check-and-build
    if: always() # ⚡ 关键：确保无论上面的构建是成功、失败还是被跳过，清理任务每次都必须执行
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 6
