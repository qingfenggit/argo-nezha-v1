name: docker-publish-git
on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 19 * * 2,6'  # Asia/Shanghai 每周天凌晨3点

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_IMAGE_NAME: "argo-nezha-v1"
  GITHUB_REPO: "nezhahq/nezha"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      need_update: ${{ steps.check.outputs.need_update }}
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须设置为 0，拉取所有历史记录和 tags 用于对比本地版本

      - name: Check upstream release version
        id: check
        run: |
          # 1. 获取上游官方仓库的最新 Release Tag (这里以 naiba/nezha 为例，如需监控其他组件请替换 URL)
          UPSTREAM_VERSION=$(curl -sL https://api.github.com/repos/naiba/nezha/releases/latest | jq -r .tag_name)
          
          # 2. 获取本地仓库最新的 Tag
          # 如果你的仓库还没打过 Tag，默认给个初始值 v0.0.0
          LOCAL_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          echo "Upstream Latest: $UPSTREAM_VERSION"
          echo "Local Latest: $LOCAL_VERSION"
          
          echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          
          # 3. 对比版本
          if [ "$UPSTREAM_VERSION" != "$LOCAL_VERSION" ] && [ "$UPSTREAM_VERSION" != "null" ]; then
            echo "need_update=true" >> $GITHUB_OUTPUT
            echo "::notice::发现新版本 $UPSTREAM_VERSION，准备触发构建。"
          else
            echo "need_update=false" >> $GITHUB_OUTPUT
            echo "当前已是最新版本，无需动作。"
          fi
          
  build-and-push:
    needs: check-upstream
    if: needs.check-upstream.outputs.need_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限，以便构建完成后推送新的 Tag
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get latest release tag
        id: get_latest_tag
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          echo "Latest tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Get current Docker image version
        id: get_current_version
        run: |
          CURRENT_TAG=$(curl -s "https://hub.docker.com/v2/repositories/${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}/tags/" | \
                       jq -r '.results[] | select(.name != "latest") | .name' | sort -V | tail -n 1)
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="0.0.0"
          fi
          echo "当前Docker镜像版本: $CURRENT_TAG"
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare_versions
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          CURRENT_TAG="${{ steps.get_current_version.outputs.current_tag }}"

          LATEST_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
          CURRENT_VERSION=$(echo "$CURRENT_TAG" | sed 's/^v//')

          HIGHER_VERSION=$(echo -e "$LATEST_VERSION\n$CURRENT_VERSION" | sort -V | tail -n 1)

          if [[ "$HIGHER_VERSION" == "$LATEST_VERSION" && "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            echo "新版本可用，继续..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "没有可用的新版本，停止..."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.compare_versions.outputs.should_build == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get_latest_tag.outputs.latest_tag }}

      - name: Send Telegram notification
        if: steps.compare_versions.outputs.should_build == 'true'
        env:
          DOCKER_IMAGE_URL: https://hub.docker.com/r/${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}/tags
        run: |
          MESSAGE="新的 ${{ env.DOCKER_IMAGE_NAME }} 镜像已推送 🚀%0A%0A"
          MESSAGE+="版本: ${{ steps.get_latest_tag.outputs.latest_tag }}%0A"
          MESSAGE+="镜像地址: $DOCKER_IMAGE_URL"
            
  cleanup-runs:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 修正：使用标准的GITHUB_TOKEN
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 6
